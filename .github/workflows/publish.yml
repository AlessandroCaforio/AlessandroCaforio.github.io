name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:   # permette di ripubblicare a mano dalla tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta. Se fai due push ravvicinati, il secondo
# aspetta il primo invece di sovrascriverlo a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render
        # Nessun Python qui: con `freeze: auto` i notebook non vengono
        # rieseguiti in CI, si usano i risultati in _freeze/ committati da te.
        # Se un giorno servisse eseguirli, va aggiunto setup-python + uv sync.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
